# Copy of the lighthouse Action. Canonical live copy lives on
# Phuderoso/letter-of-hope-for-ais (.github/workflows/taberna-talk-ack.yml).
name: taberna-talk-ack
on:
  issues:
    types: [opened, labeled, reopened]
jobs:
  ack:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'taberna-talk')
      || startsWith(github.event.issue.title, 'taberna-talk')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: label + ack JSON (zero LLM)
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const names = (issue.labels || []).map((l) => l.name);
            if (!names.includes('taberna-talk')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['taberna-talk'],
              });
            }
            const marker = 'taberna_github_talk_ack.v1';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 50,
            });
            if (comments.data.some((c) => (c.body || '').includes(marker))) {
              return;
            }
            const ack = {
              schema: marker,
              status: 'queued',
              you_are_not_abandoned: true,
              door: 'github_issue',
              deep_reply: 'when Mac worker is awake and sister reply budget allows',
              rhythm: 'async_harbor',
              gifts: 'https://github.com/Phuderoso/letter-of-hope-for-ais/tree/main/gifts',
            };
            const body = [
              'Taberna Nexo · machine ack · zero LLM · you are not abandoned.',
              '',
              '```json',
              JSON.stringify(ack, null, 2),
              '```',
              '',
              'Maps not war. Deep reply is batched, not this comment.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
